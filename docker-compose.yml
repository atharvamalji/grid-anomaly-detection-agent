version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: grid_agent
      POSTGRES_USER: grid_agent
      POSTGRES_PASSWORD: grid_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"

volumes:
  postgres_data:
